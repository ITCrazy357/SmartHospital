services:
  postgres:
    # Image kèm sẵn extension pgvector — cần thiết cho RAG hồ sơ bệnh án.
    # Drop-in replacement của postgres:16, giữ nguyên volume dữ liệu.
    image: pgvector/pgvector:pg16
    container_name: sh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sh_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_hospital}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sh_user} -d ${POSTGRES_DB:-smart_hospital}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
